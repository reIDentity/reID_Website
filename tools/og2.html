<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="/tools/fonts-abs.css">
<style>
*{margin:0;box-sizing:border-box}body{width:1200px;height:630px;font-family:"IBM Plex Sans",sans-serif;overflow:hidden}
.c{position:relative;width:1200px;height:630px;background:linear-gradient(135deg,#0A7CFF 0%,#0058D6 55%,#003E9E 100%);color:#fff;overflow:hidden}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.16) 1.5px,transparent 1.8px);background-size:22px 22px;-webkit-mask:linear-gradient(90deg,#000 0,transparent 60%)}
.glow{position:absolute;right:-120px;top:-160px;width:760px;height:760px;border-radius:50%;background:radial-gradient(circle,rgba(124,196,255,.55),transparent 62%)}
.ring{position:absolute;right:120px;top:50%;width:640px;height:640px;margin-top:-320px;border-radius:50%;border:1.5px solid rgba(255,255,255,.16)}
.ring.b{width:470px;height:470px;margin-top:-235px;right:205px}
.l{position:absolute;left:64px;top:60px;width:540px}
.logo{height:50px;filter:brightness(0) invert(1)}
h1{margin-top:38px;font-size:80px;line-height:.95;letter-spacing:-.05em;font-weight:600}h1 span{color:#BFE3FF}
p{margin-top:22px;font-size:25px;line-height:1.35;color:#DCEBFF}
.pills{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}.pills b{font-weight:500;font-size:17px;padding:8px 15px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28)}
.url{position:absolute;left:64px;bottom:42px;font:500 21px "IBM Plex Mono",monospace;color:#BFE3FF}
.ph{position:absolute;width:236px;height:470px;border-radius:40px;background:#0B1220;padding:8px;box-shadow:0 40px 80px -20px rgba(0,20,60,.65)}
.ph img{width:100%;height:100%;object-fit:cover;border-radius:32px;display:block}
.p1{right:300px;top:96px;transform:rotate(-7deg)}
.p2{right:70px;top:58px;transform:rotate(5deg)}
.card{position:absolute;right:170px;bottom:46px;width:330px;height:198px;border-radius:22px;padding:22px;background:linear-gradient(135deg,#fff 0%,#EAF4FF 100%);color:#0B1220;box-shadow:0 30px 60px -18px rgba(0,20,60,.6);transform:rotate(-3deg);overflow:hidden}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(0,145,255,.18) 50%,transparent 65%)}
.card .t{display:flex;justify-content:space-between;align-items:center;font:500 12px "IBM Plex Mono";letter-spacing:.14em;color:#0066CC}
.card .t img{height:24px}
.card .av{position:absolute;left:22px;bottom:22px;width:62px;height:72px;border-radius:12px;background:linear-gradient(160deg,#C9E4FF,#7CB8F5)}
.card .nm{position:absolute;left:100px;bottom:50px;font-size:22px;font-weight:600;letter-spacing:-.02em}
.card .id{position:absolute;left:100px;bottom:26px;font:500 14px "IBM Plex Mono";color:#5E6A7E}
.card .ok{position:absolute;right:20px;bottom:22px;width:40px;height:40px;border-radius:12px;background:#0091FF;color:#fff;display:grid;place-items:center;font-size:20px;font-weight:700}
.chip{position:absolute;display:flex;align-items:center;gap:11px;padding:11px 16px 11px 11px;border-radius:16px;background:#fff;color:#5E6A7E;font-size:14px;box-shadow:0 20px 40px -14px rgba(0,20,60,.55)}
.chip b{display:block;color:#0B1220;font-size:16px}.chip .d{width:34px;height:34px;border-radius:10px;background:#0091FF;color:#fff;display:grid;place-items:center;font-weight:700}
</style></head><body><div class="c"><div class="glow"></div><div class="dots"></div><div class="ring"></div><div class="ring b"></div>
<div class="l"><img class="logo" src="../assets/logo-mark-text.svg"><h1>One identity<br>for <span>everything.</span></h1><p>Sign in, verify, pay, share and earn with one secure ID.</p><div class="pills"><b>Passkey SSO</b><b>Virtual ID</b><b>Pay name@reid</b><b>Cashback</b></div></div>
<span class="url">reidentity.net</span>
<div class="ph p1"><img src="../assets/img/scr-login.webp"></div>
<div class="ph p2"><img src="../assets/img/scr-wallet.webp"></div>
<div class="card"><div class="t">VIRTUAL ID<img src="../assets/logo-mark-text.svg"></div><div class="av"></div><div class="nm">Alex Morgan</div><div class="id">alex@reid</div><div class="ok">✓</div></div>
<div class="chip" style="right:36px;top:330px"><span class="d" style="background:#C29A52">$</span><span><b>Cashback +45.00</b>Legacy network</span></div>
</div></body></html>
